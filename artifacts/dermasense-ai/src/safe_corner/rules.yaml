version: "1.0"
disclaimer: "General wellness guidance only; not a prescription or substitute for a clinician."
urgent_review:
  trigger_classes: [BCC, MEL, SCC]
  rule_id: "CARE-01"
  title: "Discuss the screening output with a dermatologist"
  guidance: "A screening output cannot confirm a condition. Arrange a clinician review promptly."
low_confidence:
  rule_id: "CARE-02"
  title: "Ask a dermatologist to assess the concern"
  guidance: "The model is uncertain. Do not rely on this result; a qualified clinician can assess the spot."
class_context:
  ACK: "Research label only. A model class cannot confirm a diagnosis; discuss skin concerns with a clinician."
  BCC: "Research label only. A model class cannot confirm a diagnosis; discuss skin concerns with a clinician."
  MEL: "Research label only. A model class cannot confirm a diagnosis; discuss skin concerns with a clinician."
  NEV: "Research label only. A model class cannot confirm a diagnosis; discuss skin concerns with a clinician."
  SCC: "Research label only. A model class cannot confirm a diagnosis; discuss skin concerns with a clinician."
  SEK: "Research label only. A model class cannot confirm a diagnosis; discuss skin concerns with a clinician."
general:
  - rule_id: "UV-01"
    slot: "morning"
    title: "Plan for shade"
    guidance: "Use shade and protective clothing when practical, especially around midday."
  - rule_id: "UV-02"
    slot: "before_outdoors"
    title: "Use sun protection"
    guidance: "Use broad-spectrum sunscreen as directed on its label; reapply as directed while outdoors."
  - rule_id: "UV-03"
    slot: "outdoors"
    title: "Set an outdoor reapplication reminder"
    guidance: "If outdoors for an extended period, follow the sunscreen label's reapplication instructions."
  - rule_id: "SKIN-01"
    slot: "evening"
    title: "Note changes you have noticed"
    guidance: "Write down when a spot first appeared or changed to support a clinician conversation."
  - rule_id: "WELL-01"
    slot: "afternoon"
    title: "Take a hydration break"
    guidance: "Pause for water if it fits your usual routine and personal needs."
  - rule_id: "WELL-02"
    slot: "evening"
    title: "Make space for rest"
    guidance: "Follow a sleep routine that works for you."
  - rule_id: "WELL-03"
    slot: "anytime"
    title: "Consider a healthy change"
    guidance: "If smoking or alcohol is a concern for you, a clinician can discuss support options without judgment."
